<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Samball</title><link rel="stylesheet" href="style.css"></head><body><div id="homeScreen" class="screen"><div class="logo-container"><h1 class="game-title">SAMBALL</h1><p class="game-subtitle">أفضل لعبة أسرار ومهارة</p></div><div class="menu-buttons"><button class="main-btn play-btn" onclick="openGameMenu()">🎮 ابدأ اللعب</button><button class="main-btn shop-btn" onclick="openShopMenu()">🛒 المتجر الكور</button></div></div><div id="levelMenuScreen" class="screen hidden"><div class="screen-header"><button class="back-btn" onclick="backToHome()">⬅ العودة</button><h2>اختر المستوى</h2></div><div class="difficulty-buttons"></div></div><div id="shopScreen" class="screen hidden"><div class="screen-header"><button class="back-btn" onclick="backToHome()">⬅ العودة</button><h2>متجر الكور والشخصيات</h2><div class="shop-coins">🪙<span id="totalCoins">0</span></div></div><div class="custom-ball-section"><h3>🌟 كرتك الخاصة (صورتك الشخصية)</h3><p>اختر صورتك لتكون الكرة الأكثر تميزاً وغلاءً في اللعبة!</p><input type="file" id="userPhotoInput" accept="image/*" style="display:none" onchange="handleCustomPhoto(event)"><div id="customPreview" class="item-preview hidden"></div><button class="shop-btn" id="equipCustomBtn" onclick="equipCustomBall()">رفع صورة وصنع كرتك الخاصة (2500 🪙)</button></div><div class="shop-grid" id="shopGrid"></div></div><div id="gameScreen" class="screen hidden"><div class="game-header"><button class="back-btn" onclick="backToMenu()">⬅ القائمة</button><span id="currentModeTitle" class="mode-indicator">المستوى</span><div class="game-stats"><span>النقاط:<strong id="score">0</strong></span><span>الأرواح:<strong id="lives">3</strong></span><span>🪙<strong id="gameCoins">0</strong></span></div></div><div class="canvas-container"><canvas id="gameCanvas" width="360" height="500"></canvas></div><div id="messageOverlay" class="overlay hidden"><div class="overlay-content"><h2 id="overlayTitle">المستوى الأول</h2><p id="overlayText">استعد للعب</p><button id="startBtn" class="main-btn">ابدأ الآن</button></div></div></div><script src="script.js"></script></body></html>
